<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0' name='viewport' />
    <title>Groceries List</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body, input, button {
            font-family: "Silkscreen", sans-serif;
            font-size: 16px;
        }

        h1 {
            font-size: 2rem;
        }

        h3 {
            font-size: 1rem;
        }

        .product-input {
            flex: 1;
        }

        .quantity-input {
            width: 80px;
        }

        .completed {
            text-decoration: line-through;
            opacity: 0.5;
        }
    </style>
</head>

<body class="py-4">

    <div class="container max-width-md" style="max-width: 600px;">
        <header class="text-center mb-4">
            <h1>Groceries List</h1>
            <h3 class="text-secondary">By Jesús Ameller</h3>
        </header>

        <form id="todo-form" class="d-flex gap-2 mb-4">
            <i class="bi bi-play-fill fs-3 align-self-center"></i>
            <input type="text" id="product-name" class="form-control product-input" placeholder="Product" required>
            <input type="number" id="product-qty" class="form-control quantity-input" min="1" value="1" required>
            <button type="submit" class="btn btn-success px-4">Add</button>
        </form>

        <ul id="product-list" class="list-group"></ul>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const form = document.getElementById("todo-form");
        const listE = document.getElementById("product-list");
        const inputName = document.getElementById("product-name");
        const inputQty = document.getElementById("product-qty");

        let products = JSON.parse(localStorage.getItem("products")) || [];

        const save = () => {
            localStorage.setItem("products", JSON.stringify(products));
        };

        const render = () => {
            listE.innerHTML = "";
            products.forEach((product, index) => {
                const li = document.createElement("li");
                li.className = "list-group-item d-flex justify-content-between align-items-center gap-2";
                
                const span = document.createElement("span");
                span.textContent = `${product.name} (x${product.quantity})`;
                span.className = `flex-grow-1 ${product.completed ? "completed" : ""}`;
                
                const toggleBtn = document.createElement("button");
                toggleBtn.className = `btn btn-sm ${product.completed ? "btn-secondary" : "btn-success"}`;
                toggleBtn.textContent = "✔";
                toggleBtn.onclick = () => toggleProduct(index);

                const deleteBtn = document.createElement("button");
                deleteBtn.className = "btn btn-danger btn-sm";
                deleteBtn.textContent = `✗`;
                deleteBtn.onclick = () => removeProduct(index);

                const actionsDiv = document.createElement("div");
                actionsDiv.className = "d-flex gap-2";
                actionsDiv.appendChild(toggleBtn);
                actionsDiv.appendChild(deleteBtn);

                li.appendChild(span);
                li.appendChild(actionsDiv);
                listE.appendChild(li);
            });
        };

        const addProduct = (e) => {
            e.preventDefault();
            const name = inputName.value.trim();
            const quantity = parseInt(inputQty.value, 10);

            if (!name || quantity < 1) return;

            products.push({ name, quantity, completed: false });
            save();
            render();

            inputName.value = "";
            inputQty.value = "1";
            inputName.focus();
        };

        const toggleProduct = (index) => {
            products[index].completed = !products[index].completed;
            save();
            render();
        };

        const removeProduct = (index) => {
            products.splice(index, 1);
            save();
            render();
        };

        form.addEventListener("submit", addProduct);
        render();
    </script>
</body>

</html>
