<!DOCTYPE html>
<html data-bs-theme="dark">

<head>

    <meta charset="UTF-8">
    <meta content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0' name='viewport' />
    <title>Groceries List</title>

    <link href="lib/bootstrap.min.css" rel="stylesheet">
    <link href="lib/fonts.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet" />
    <link href="lib/bootstrap-icons.min.css" rel="stylesheet">

</head>

<body class="py-4">

    <div class="container max-width-md" style="max-width: 600px;">

        <div class="main-section">

            <header class="text-center mb-4">
                <h2 class="h1" translate="main_title">Groceries List</h2>
                <h3 class="text-secondary" translate="by_author">By Jesús Ameller</h3>
            </header>

            <form id="todo-form" class="needs-validation" novalidate>
                <div class="d-flex gap-2">
                    <div class="flex-grow-1">
                        <input type="text" id="product-name" class="form-control product-input" placeholder="Product"
                            translate="product" required>
                        <div class="invalid-feedback">
                            Ingresa un nombre de producto.
                        </div>
                    </div>
                    <div>
                        <input type="number" id="product-qty" class="form-control quantity-input" min="1" value="1"
                            required>
                        <div class="invalid-feedback">
                            Mínimo 1.
                        </div>
                    </div>
                </div>
                <div class="d-flex gap-2 mt-05">
                    <button type="submit" class="btn btn-success" translate="add">Add</button>
                </div>
                <div class="actions d-flex gap-2 mt-05 mb-4">
                    <button type="button" class="btn btn-primary configuration" translate="configuration">
                        Configuration
                    </button>
                    <button type="button" class="btn btn-primary share" translate="share">
                        Share
                    </button>
                </div>
            </form>

            <ul id="product-list" class="list-group"></ul>
        </div>

        <div class="settings-section" style="display: none;">

            <header class="text-center mb-4">
                <h2 class="h1" translate="configuration">Settings</h2>
            </header>

            <div class="card">
                <div class="card-body">
                    <div>
                        <div class="d-flex justify-content-between align-items-center">
                            <div class="translate-box">
                                <i class="bi bi-translate"></i>
                                <span translate="language">Language</span>
                            </div>
                            <a class="btn" data-bs-toggle="collapse" href=".language-options" onclick="toogleSection()">
                                <i class="bi bi-chevron-down"></i>
                                <i class="bi bi-chevron-up" style="display: none;"></i>
                            </a>
                        </div>
                        <div class="collapse language-options">
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="languageInput" id="language-en"
                                    value="en" checked>
                                <label class="form-check-label" translate="english">
                                    English
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="languageInput" id="language-es"
                                    value="es">
                                <label class="form-check-label" translate="spanish">
                                    Spanish
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="languageInput" id="language-ca"
                                    value="ca">
                                <label class="form-check-label" translate="catalan">
                                    Catalan
                                </label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <button class="btn btn-success mt-05" translate="save" onclick="saveConfiguration()">
                Save
            </button>
        </div>

        <div class="share-section" style="display: none;">

            <header class="text-center mb-4">
                <h2 class="h1" translate="share">Share</h2>
                <h3 class="text-secondary" translate="link">Share your list!</h3>
            </header>

            <input type="text" name="share">
            <button class="btn btn-success mt-05" translate="copy">Copy</button>

        </div>

    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3 top-0 start-50 translate-middle-x"
        style="z-index: 1100;">
        <div id="app-toast" class="toast align-items-center" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div id="toast-body" class="toast-body"></div>
                <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <script src="lib/bootstrap.bundle.min.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/navigator.js"></script>
    <script src="js/traductions.js"></script>
    <script src="js/configuration.js"></script>
    <script src="app.js"></script>

</body>

</html>
